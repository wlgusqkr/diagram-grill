services:
  api:
    image: example/rag-api:1
    environment:
      VECTOR_URL: http://vectors:6333
      QUEUE_URL: redis://queue:6379
  indexer:
    image: example/rag-indexer:1
    environment:
      VECTOR_URL: http://vectors:6333
      QUEUE_URL: redis://queue:6379
    volumes:
      - ./imports:/imports:ro
  vectors:
    image: qdrant/qdrant:v1
  queue:
    image: redis:7
