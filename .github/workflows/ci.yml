name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/diagram-grill/requirements.lock

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
          dot -V

      - name: Install Python dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --requirement skills/diagram-grill/requirements.lock

      - name: Lint skill contract
        run: python scripts/lint_skill.py

      - name: Validate evaluation fixtures
        run: python evals/harness.py validate-fixtures

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
