version: 2

updates:
  - package-ecosystem: pip
    directory: "/skills/diagram-grill"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      action-dependencies:
        patterns:
          - "*"
